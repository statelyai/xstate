packages:
  - 'packages/*'
  - 'scripts/*'
  - 'examples/*'

allowBuilds:
  '@parcel/watcher': true
  '@scarf/scarf': true
  better-sqlite3: true
  cbor-extract: true
  core-js: true
  deasync: false
  esbuild: true
  fsevents: true
  husky: true
  lmdb: true
  msgpackr-extract: true
  oxc-resolver: true
  protobufjs: true
  svelte-preprocess: true
  vue-demi: true

linkWorkspacePackages: true

minimumReleaseAgeExclude:
  - '@changesets/apply-release-plan@8.0.0'
  - '@changesets/assemble-release-plan@7.0.0'
  - '@changesets/changelog-git@1.0.0'
  - '@changesets/cli@3.0.0'
  - '@changesets/config@4.0.0'
  - '@changesets/errors@1.0.0'
  - '@changesets/get-dependents-graph@3.0.0'
  - '@changesets/git@4.0.0'
  - '@changesets/parse@1.0.0'
  - '@changesets/pre@3.0.0'
  - '@changesets/read@1.0.0'
  - '@changesets/should-skip-package@1.0.0'
  - '@changesets/types@7.0.0'
  - '@changesets/write@1.0.0'

overrides:
  # Supported by svelte-preprocess 6; replace its retained legacy optional peer.
  stylus: 0.64.0
  'esbuild@>=0.28.0 <0.28.1': 0.28.1
  # Compatible same-major security fixes for transitive tooling.
  '@babel/core@>=7.0.0 <7.29.1': 7.29.7
  'ajv@>=8.0.0 <8.18.0': 8.20.0
  'browserslist@>=4.0.0 <4.28.7': 4.28.9
  'devalue@>=5.0.0 <5.6.4': 5.9.2
  'fast-uri@>=3.0.0 <3.1.6': 3.1.7
  'glob@>=10.2.0 <10.5.0': 10.5.0
  'js-cookie@>=3.0.0 <3.0.6': 3.0.8
  'lodash@>=4.0.0 <4.17.24': 4.18.1
  'minimatch@>=9.0.0 <9.0.7': 9.0.9
  'nanoid@>=3.0.0 <3.3.18': 3.3.18
  'picomatch@>=4.0.0 <4.0.4': 4.0.7
  'piscina@>=4.0.0 <4.9.3': 4.9.4
  'preact@>=10.28.0 <10.28.2': 10.29.8
  'qs@>=6.0.0 <6.16.0': 6.16.0
  'rollup@>=4.0.0 <4.59.0': 4.63.1
  'svelte@>=5.0.0 <5.55.7': 5.57.0
  # SCXML tests read this pinned package's fixtures only, never its HTTP runner.
  '@scion-scxml/test-framework@2.0.16>cli-table': '-'
  '@scion-scxml/test-framework@2.0.16>github': '-'
  '@scion-scxml/test-framework@2.0.16>grunt': '-'
  '@scion-scxml/test-framework@2.0.16>grunt-release': '-'
  '@scion-scxml/test-framework@2.0.16>load-grunt-tasks': '-'
  '@scion-scxml/test-framework@2.0.16>node-static': '-'
  '@scion-scxml/test-framework@2.0.16>nopt': '-'
  '@scion-scxml/test-framework@2.0.16>request': '-'
  '@scion-scxml/test-framework@2.0.16>underscore': '-'
  '@types/node': 25.2.1
  'react-bootstrap@1.6.8>@types/react': 18.3.28
  'react-error-boundary@3.1.4>@types/react': 18.3.28
  'vite-node@3.2.4>vite': 6.4.3
  'vite@>=6.0.0 <6.4.3': 6.4.3
  vue: 3.5.17
  yaml: 2.9.0

patchedDependencies:
  '@vue/test-utils@2.4.6': patches/@vue__test-utils@2.4.6.patch
