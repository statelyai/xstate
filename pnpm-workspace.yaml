packages:
  - 'packages/*'
  - 'scripts/*'

allowBuilds:
  '@parcel/watcher': true
  '@scarf/scarf': true
  core-js: true
  deasync: false
  esbuild: true
  fsevents: true
  husky: true
  lmdb: true
  msgpackr-extract: true
  oxc-resolver: true
  parcel-bundler: true
  svelte-preprocess: true
  vue-demi: true

overrides:
  '@types/node': 25.2.1
  stylus: 0.55.0
  vite: 5.4.21

patchedDependencies:
  '@vue/test-utils@2.4.6': patches/@vue__test-utils@2.4.6.patch
