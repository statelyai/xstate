name: 'CI checks'
runs:
  using: 'composite'
  steps:
    - name: Build
      run: pnpm build
      shell: bash

    - name: Strict built package declarations
      run: node scripts/check-built-types.mjs
      shell: bash

    - name: Oxlint
      run: pnpm lint
      shell: bash

    - name: Oxfmt
      run: pnpm format:check
      shell: bash

    - name: Typecheck
      run: pnpm typecheck && pnpm typecheck:adapter-consumers
      shell: bash

    - name: Test
      run: pnpm test --silent
      shell: bash

    - name: Svelte Check
      run: pnpm --filter @xstate/svelte svelte-check
      shell: bash

    - name: Knip
      run: pnpm knip
      shell: bash
