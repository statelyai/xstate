name: 'CI checks'
runs:
  using: 'composite'
  steps:
    - name: Build
      run: pnpm build
      shell: bash

    - name: Core bundle size
      run: pnpm bench:size -- --verify
      shell: bash

    - name: FSM runtime
      run: pnpm bench:fsm-runtime -- --verify
      shell: bash

    - name: Oxlint
      run: pnpm lint
      shell: bash

    - name: Oxfmt
      run: pnpm format:check
      shell: bash

    - name: Typecheck
      run: pnpm typecheck
      shell: bash

    - name: Test
      run: pnpm test --silent
      shell: bash

    - name: Svelte Check
      run: pnpm --filter @xstate/svelte svelte-check
      shell: bash

    - name: Knip
      run: pnpm knip
      shell: bash
