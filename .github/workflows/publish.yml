name: Publish

on:
  push:
    branches:
      - main
      - next

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

permissions: {} # each job should define its own permission explicitly

jobs:
  select-mode:
    name: Select Mode
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    permissions:
      contents: read # to check out repo (actions/checkout)
    steps:
      - uses: $/.github/actions/ci-setup

      - name: Select mode
        id: select-mode
        # https://github.com/changesets/action
        uses: changesets/action/select-mode@22ccf9aa43179fe9e27dc62e575971d28cce197c # v2.0.0

  version:
    name: Version
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'version'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # to create version commits (changesets/action)
      pull-requests: write # to create pull request (changesets/action)
    steps:
      - uses: $/.github/actions/ci-setup

      - name: Create or update release pull request
        # https://github.com/changesets/action
        uses: changesets/action/version@22ccf9aa43179fe9e27dc62e575971d28cce197c # v2.0.0
        with:
          script: pnpm run version

  pack:
    name: Pack
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    permissions:
      contents: read # to check out repo (actions/checkout)
    steps:
      - uses: $/.github/actions/ci-setup

      - name: Build
        run: pnpm build

      - name: Pack
        id: pack
        # https://github.com/changesets/action
        uses: changesets/action/pack@22ccf9aa43179fe9e27dc62e575971d28cce197c # v2.0.0
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    name: Publish
    needs: pack
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 20
    permissions:
      contents: write # to create release (changesets/action)
      id-token: write # to use OpenID Connect token for trusted publishing (changesets/action)
    steps:
      - uses: $/.github/actions/ci-setup

      # Trusted publishing can only be configured after a package exists. Use
      # the npm token for @xstate/effect's first publish, then return to OIDC.
      - name: Check whether @xstate/effect needs bootstrap authentication
        id: effect-bootstrap
        shell: bash
        run: |
          registry_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            'https://registry.npmjs.org/@xstate%2feffect')"

          case "$registry_status" in
            200) echo 'required=false' >> "$GITHUB_OUTPUT" ;;
            404) echo 'required=true' >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::Unexpected npm registry status: $registry_status"
              exit 1
              ;;
          esac

      - name: Bootstrap publish to npm
        if: steps.effect-bootstrap.outputs.required == 'true'
        # https://github.com/changesets/action
        uses: changesets/action/publish@22ccf9aa43179fe9e27dc62e575971d28cce197c # v2.0.0
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Publish to npm with trusted publishing
        if: steps.effect-bootstrap.outputs.required == 'false'
        # https://github.com/changesets/action
        uses: changesets/action/publish@22ccf9aa43179fe9e27dc62e575971d28cce197c # v2.0.0
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
